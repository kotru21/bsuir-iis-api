name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      # The release job runs on the same push as CI but independently of it, so it must
      # not publish anything that has not passed the full check suite itself.
      - name: Lint and format
        run: |
          npm run lint
          npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke:dist
      - run: npm run api:report:check
      - run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Check if version is already published
        id: publish_check
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo "__NOT_PUBLISHED__")

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "published_version=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$PACKAGE_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Pending changesets on main → open or update the "chore: release packages" PR
      # (version bump + CHANGELOG). No `publish-script`: with no changesets the action does
      # nothing, and publishing happens in the steps below. Merging the Release PR (or
      # pushing a commit that ran `npx changeset version` locally) publishes.
      - name: Create or update Release PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: npx changeset version
          commit-message: "chore: version packages"
          pr-title: "chore: release packages"

      - name: Publish to npm
        if: steps.changesets.outputs.has-changesets == 'false' && steps.publish_check.outputs.should_publish == 'true'
        run: npm publish --provenance --access public

      # `npm publish` creates no git tag; the tag and release notes come from here.
      - name: Tag and create GitHub release
        if: steps.changesets.outputs.has-changesets == 'false' && steps.publish_check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.publish_check.outputs.package_version }}
        run: |
          tag="v${VERSION}"
          # The "## <version>" section of CHANGELOG.md, without its heading.
          notes=$(awk -v heading="## ${VERSION}" '$0 == heading { found = 1; next } found && /^## / { exit } found' CHANGELOG.md)
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "${notes:-See CHANGELOG.md}"

      - name: Skip publish
        if: steps.changesets.outputs.has-changesets == 'true' || steps.publish_check.outputs.should_publish != 'true'
        run: |
          echo "Nothing to publish: ${{ steps.publish_check.outputs.package_name }}@${{ steps.publish_check.outputs.package_version }} (latest on npm: ${{ steps.publish_check.outputs.published_version }}), pending changesets: ${{ steps.changesets.outputs.has-changesets }}."
