name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # eslint-plugin-unicorn@66+ and eslint-plugin-jsdoc@63+ require Node >=22.
      # On Node 20 we still verify the published runtime surface (types/tests/build).
      - name: Lint and format
        if: matrix.node-version != 20
        run: |
          npm run lint
          npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json
        if: matrix.node-version == 24
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node-version == 24
        with:
          name: sbom
          path: sbom.cdx.json
      # Only verify the committed API report against the freshly built types. Do NOT run
      # `api:report` (--local) here: it overwrites etc/*.api.md before the check, so any
      # drift in the public API surface would be silently regenerated and never fail CI.
      - run: npm run api:report:check
        if: matrix.node-version == 24

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:browser
